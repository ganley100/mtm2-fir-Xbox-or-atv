org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=false
# Which CPUs to build for, comma-separated. armeabi-v7a is 32-bit ARM, what
# most Google TV / Android TV boxes run apps as; arm64-v8a can be added for
# 64-bit devices (the guest then lives in one 4 GB block instead of 1:1).
mtm.abis=armeabi-v7a
# -O level for the 2.46M lines of lifted C. -O1 builds much faster.
mtm.genOpt=-O2
# ON: build without src/recomp/gen, to check the toolchain and packaging.
mtm.noLift=OFF
