// Monster Truck Madness 2 for Android TV: SDL2's SDLActivity around the
// portable host (libmain.so, src/portable/). docs/android.md has the steps.
plugins {
    id 'com.android.application'
}

def mtmRoot = file('../..')
def abis = (project.findProperty('mtm.abis') ?: 'armeabi-v7a').split(',').collect { it.trim() }

android {
    namespace 'com.mtm2.recomp'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.mtm2.recomp'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1-alpha'
        ndk { abiFilters(*abis) }
        externalNativeBuild {
            cmake {
                arguments "-DPCRECOMP=${project.findProperty('mtm.pcrecomp') ?: new File(mtmRoot, '../pcrecomp').canonicalPath}",
                          "-DMTM_NO_LIFT=${project.findProperty('mtm.noLift') ?: 'OFF'}",
                          "-DGEN_OPT=${project.findProperty('mtm.genOpt') ?: '-O2'}"
            }
        }
    }

    // Two apps, installable side by side: the full game and the 1998 demo.
    // Each builds its own lift (src/recomp/gen, src/recomp/gen-demo) and reads
    // its own files from its own folder on the device.
    flavorDimensions 'version'
    productFlavors {
        full {
            dimension 'version'
            externalNativeBuild { cmake { arguments '-DMTM_VARIANT=full' } }
        }
        demo {
            dimension 'version'
            applicationIdSuffix '.demo'
            versionNameSuffix '-demo'
            externalNativeBuild { cmake { arguments '-DMTM_VARIANT=demo' } }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so `assembleRelease` installs as is;
            // use your own signingConfig to publish.
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        // SDLActivity and friends, from the SDL2 checkout (android/fetch-deps.sh).
        main.java.srcDirs += '../deps/SDL/android-project/app/src/main/java'
        // The launcher banners: yours from tools/make_banner.py (android/banner,
        // android/banner-demo; gitignored) when they are there, else the plain
        // built-in ones. The demo's, when it has one, is used over the full game's.
        main.res.srcDirs += file('../banner/res/drawable-xhdpi/banner.png').exists()
                ? '../banner/res' : 'src/main/res-banner'
        if (file('../banner-demo/res/drawable-xhdpi/banner.png').exists()) {
            demo.res.srcDirs += '../banner-demo/res'
        } else if (!file('../banner/res/drawable-xhdpi/banner.png').exists()) {
            demo.res.srcDirs += 'src/demo/res-banner'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
