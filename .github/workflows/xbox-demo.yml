# The playable Xbox Dev Mode package of the 1998 demo, built in Actions and
# handed back ENCRYPTED.
#
# The demo is Microsoft's, so nothing of it is ever in this repository, and
# nothing of it leaves the run readable: the installer is downloaded during
# the run from a link kept in the repository secret MTM2_TRIAL_URL, checked
# against the trial's known SHA-256, unpacked, translated, built and packaged
# on the runner (which is thrown away after), and the only thing uploaded is
# a 7-Zip archive encrypted (AES-256, file names too) with the password in the
# secret MTM2_ARTIFACT_PASSWORD, which GitHub deletes after a day. In a public
# repository anyone can download the artifact meanwhile, but without the
# password it is noise.
#
# Runs only by hand; secrets are not given to runs from forks.
# To use: add both secrets (Settings -> Secrets and variables -> Actions),
# then Actions -> "Xbox demo (encrypted)" -> Run workflow, download the
# artifact and open it with 7-Zip and your password. docs/xbox.md.
name: Xbox demo (encrypted)

on:
  workflow_dispatch:
    inputs:
      pcrecomp_ref:
        description: 'pcrecomp commit, branch or tag'
        default: '2adc02fec0702933325801aa7b29a7646321857f'

permissions:
  contents: read

env:
  PCRECOMP_REF: ${{ github.event.inputs.pcrecomp_ref || '2adc02fec0702933325801aa7b29a7646321857f' }}
  TRIAL_SHA256: aeaceb155b6a8c3fde61b571b9f095acaa7e98e54250c6e89e49a3c0595ceb4f

jobs:
  demo-msix:
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Both secrets are set
        shell: pwsh
        env:
          TRIAL_URL: ${{ secrets.MTM2_TRIAL_URL }}
          ARTIFACT_PASSWORD: ${{ secrets.MTM2_ARTIFACT_PASSWORD }}
        run: |
          if (-not $env:TRIAL_URL) {
            Write-Error 'No MTM2_TRIAL_URL secret: add a direct download link to MtM2trial.EXE (Settings -> Secrets and variables -> Actions).'
            exit 1
          }
          if (-not $env:ARTIFACT_PASSWORD -or $env:ARTIFACT_PASSWORD.Trim().Length -lt 12) {
            Write-Error 'No MTM2_ARTIFACT_PASSWORD secret of 12 characters or more: the package is only uploaded encrypted with it.'
            exit 1
          }

      - uses: actions/checkout@v4
        with:
          path: mtm

      - uses: actions/checkout@v4
        with:
          repository: sp00nznet/pcrecomp
          ref: ${{ env.PCRECOMP_REF }}
          path: pcrecomp

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: The trial, from your link
        shell: pwsh
        env:
          TRIAL_URL: ${{ secrets.MTM2_TRIAL_URL }}
        run: |
          New-Item -ItemType Directory -Force trial | Out-Null
          Invoke-WebRequest $env:TRIAL_URL.Trim() -OutFile trial/MtM2trial.EXE
          $sha = (Get-FileHash trial/MtM2trial.EXE -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne $env:TRIAL_SHA256) {
            Write-Error "MtM2trial.EXE from the link is not the trial this was built against (SHA-256 $sha)"
            exit 1
          }
          Write-Host "MtM2trial.EXE ok ($((Get-Item trial/MtM2trial.EXE).Length) bytes)"

      - name: Lay out, catalog and lift the demo
        shell: pwsh
        env:
          PCRECOMP: ${{ github.workspace }}/pcrecomp
        working-directory: mtm
        run: |
          python -m pip install --quiet capstone
          python tools/gamefiles.py --demo ../trial/MtM2trial.EXE
          python tools/catalog.py --demo
          python run_lift.py --demo

      - name: Liberation fonts
        shell: pwsh
        continue-on-error: true
        run: |
          $url = 'https://github.com/liberationfonts/liberation-fonts/files/7261482/liberation-fonts-ttf-2.1.5.tar.gz'
          Invoke-WebRequest $url -OutFile fonts.tgz
          tar -xzf fonts.tgz
          New-Item -ItemType Directory -Force mtm/xbox/fonts | Out-Null
          Copy-Item liberation-fonts-ttf-2.1.5/*.ttf, liberation-fonts-ttf-2.1.5/LICENSE mtm/xbox/fonts/

      - name: Build
        shell: pwsh
        run: mtm/xbox/build.ps1 -Variant demo -Pcrecomp pcrecomp

      - name: Package, with the demo inside
        shell: pwsh
        run: |
          mtm/xbox/package.ps1 -Variant demo -Game mtm/game-demo
          Get-ChildItem mtm/xbox/out

      # Only the encrypted archive leaves the runner. -mhe=on hides the file
      # names too; the password comes from the secret, which the log masks.
      - name: Encrypt
        shell: pwsh
        env:
          ARTIFACT_PASSWORD: ${{ secrets.MTM2_ARTIFACT_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force sealed | Out-Null
          # Trimmed: a secret pasted on a phone easily carries a line break,
          # which 7-Zip would take as part of the password.
          $pw = $env:ARTIFACT_PASSWORD.Trim()
          & 7z a -t7z -mx=5 -mhe=on "-p$pw" sealed/mtm2-xbox-demo.7z ./mtm/xbox/out/* | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Error '7-Zip failed'; exit 1 }
          Remove-Item -Recurse -Force mtm/xbox/out, mtm/game-demo, mtm/src/recomp/gen-demo, trial
          Get-ChildItem sealed

      - uses: actions/upload-artifact@v4
        with:
          name: mtm2-xbox-demo-encrypted-${{ github.sha }}
          path: sealed/mtm2-xbox-demo.7z
          retention-days: 1          # deleted by GitHub after a day
          if-no-files-found: error
