; Monster Truck Madness 2 - controller mapping (Xbox-style XInput pads).
;
; mtm.exe reads this file from beside itself (the build copies it there), or
; from the path given with --pad. --no-pad turns the controller off; headless
; runs never read it.
;
; The game itself only knows the keyboard and mouse, so each pad input below
; becomes a key, held for as long as the input is held. Values are key names
; as --key takes them: UP DOWN LEFT RIGHT SPACE ENTER ESC SHIFT CTRL ALT TAB
; BACKSPACE INSERT DELETE HOME END PGUP PGDN PAUSE F1..F12 NUM0..NUM9, a single
; letter or digit (A, Z, 1), or a virtual-key code (0x20). Two keys at once:
; "UP+SHIFT". Leave a value empty for nothing.
;
; Inputs: A B X Y LB RB LT RT LS RS START BACK DPAD_UP DPAD_DOWN DPAD_LEFT
; DPAD_RIGHT LSTICK_UP LSTICK_DOWN LSTICK_LEFT LSTICK_RIGHT RSTICK_UP
; RSTICK_DOWN RSTICK_LEFT RSTICK_RIGHT

[buttons]
; Driving. The arrows are what the race is known to read (throttle on UP,
; steering on LEFT/RIGHT).
RT=UP
LT=DOWN
LSTICK_LEFT=LEFT
LSTICK_RIGHT=RIGHT
LSTICK_UP=
LSTICK_DOWN=
DPAD_UP=UP
DPAD_DOWN=DOWN
DPAD_LEFT=LEFT
DPAD_RIGHT=RIGHT

; Menus and dialogs: ENTER presses the default button, ESC backs out / pauses.
A=ENTER
B=ESC
START=ESC

; The rest are free. Check the game's own key list (Options > Controls in
; the race menu) and put its keys here, e.g. gear up/down on RB/LB, the
; camera views on Y, the horn on X, look left/right on the right stick.
X=
Y=
LB=
RB=
LS=
RS=
RSTICK_UP=
RSTICK_DOWN=
RSTICK_LEFT=
RSTICK_RIGHT=

[settings]
; Which pad, 1-4; 0 takes the first one connected.
player=0
; Stick travel ignored around the centre (0-32767) and trigger travel
; ignored before it counts as pressed (0-255).
stick_deadzone=12000
trigger_threshold=40
; Cursor mode: this button switches between driving and moving the mouse
; pointer with the sticks, for the title menu and Driver Check-in. In cursor
; mode cursor_click is the left mouse button and cursor_right_click the right.
cursor_toggle=BACK
cursor_click=A
cursor_right_click=B
; Pointer speed at full stick, in pixels per 8 ms poll.
cursor_speed=14
